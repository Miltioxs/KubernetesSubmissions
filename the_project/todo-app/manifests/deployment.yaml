apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
      - name: shared-files
        persistentVolumeClaim:
          claimName: local-storage-todo-app-pvc
      containers:
        - name: todo-app
          image: miltioxs/todo-app:v2.2
          envFrom:
            - configMapRef:
                name: todo-app-configmap
          ports:
            - containerPort: 8080
              name: http-todo-app
          volumeMounts:
            - name: shared-files
              mountPath: /usr/src/app/images
