apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: miltioxs/todo-app:v1.5
          env:
            # Overrides the image default (3000) to show env vars work
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
