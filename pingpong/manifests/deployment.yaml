apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-deployment
  labels:
    app: pingpong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
      - name: shared-files
        persistentVolumeClaim:
          claimName: local-storage-pvc
      containers:
      - name: pingpong
        image: miltioxs/pingpong:v1.11
        env:
        - name: PORT
          value: "3000"
        - name: PINGPONG_FILE
          value: /usr/src/app/files/pingpong.txt
        ports:
        - containerPort: 3000
          name: http-pingpong
        volumeMounts:
        - name: shared-files
          mountPath: /usr/src/app/files
