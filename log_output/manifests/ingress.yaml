apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exercises-ingress
  namespace: exercises
spec:
  rules:
  - http:
      paths:
      - path: /status
        pathType: Prefix
        backend:
          service:
            name: log-output-service
            port:
              number: 80
      - path: /pingpong
        pathType: Prefix
        backend:
          service:
            name: pingpong-service
            port:
              number: 80