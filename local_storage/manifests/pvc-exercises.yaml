apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-storage-exercises-pvc # name of the volume claim, this will be used in the deployment
  namespace: exercises
spec:
  storageClassName: my-local-storage-exercises-pv # this is the name of the persistent volume we are claiming
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi