apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-storage-todo-app-pvc
  namespace: project # name of the volume claim, this will be used in the deployment
spec:
  storageClassName: my-local-storage-todo-app-pv # this is the name of the persistent volume we are claiming
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi